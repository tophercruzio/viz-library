[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda-christophersnook"
version = "0.1.0"
description = "A small, functional wrapper around matplotlib for quick, good-looking charts."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Snook" }]
keywords = ["matplotlib", "plotting", "charts", "visualization", "dataviz"]
dependencies = ["matplotlib>=3.5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/tophercruzio/viz-library"
Repository = "https://github.com/tophercruzio/viz-library"
Issues = "https://github.com/tophercruzio/viz-library/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
