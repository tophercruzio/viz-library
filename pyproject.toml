[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda-christophersnook"
version = "0.1.0"
description = "A small, functional wrapper around matplotlib for quick, good-looking charts."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "viz-library contributors" }]
keywords = ["matplotlib", "plotting", "charts", "visualization", "dataviz"]
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tophercruzio/viz-library"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
